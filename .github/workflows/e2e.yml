name: E2E Tests

# Manual trigger only. The suite in src/test/e2e still asserts against an
# earlier version of the site (a placeholder blog page, a /cv link on the
# about page, an underscore in the CV filename), so it fails on main today.
#
# To run it automatically again, update those specs first, then restore:
#
#   on:
#     workflow_run:
#       workflows: [Deploy]     # plural and a list; "workflow: Deploy"
#       types: [completed]      # is not valid and never ran
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}